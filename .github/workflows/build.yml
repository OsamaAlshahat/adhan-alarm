name: Build App (Android & iOS)
on: workflow_dispatch

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create . --platforms=android --project-name adhan_alarm
      - name: Configure Android permissions and full-screen intent support
        run: |
          M=android/app/src/main/AndroidManifest.xml
          P='<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.DISABLE_KEYGUARD"/><uses-permission android:name="android.permission.READ_CALENDAR"/><uses-permission android:name="android.permission.WRITE_CALENDAR"/>'
          sed -i "s|<application|$P<application|" $M
          sed -i 's|<activity|<activity android:showWhenLocked="true" android:turnScreenOn="true" android:inheritShowWhenLocked="true"|' $M
          # Set app display name to Awan everywhere in AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Awan"|g' $M
          # Ensure both android:icon and android:roundIcon are in AndroidManifest.xml
          python3 -c "
          with open('$M', 'r') as f:
              content = f.read()
          if 'android:roundIcon' not in content:
              content = content.replace('android:icon=\"@mipmap/ic_launcher\"', 'android:icon=\"@mipmap/ic_launcher\" android:roundIcon=\"@mipmap/ic_launcher_round\"')
          with open('$M', 'w') as f:
              f.write(content)
          "
          # Provide strings.xml for system app name resolution (English & Arabic)
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-ar
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Awan</string>
          </resources>
          EOF
          cat > android/app/src/main/res/values-ar/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">أوان</string>
          </resources>
          EOF
          # Add alarm RING intent filter so the alarm package can launch the activity on lock screen
          python3 -c "
          with open('$M', 'r') as f:
              content = f.read()
          ring_filter = '''        <intent-filter>
                  <action android:name=\"com.gdelataillade.alarm.action.RING\"/>
                  <category android:name=\"android.intent.category.DEFAULT\"/>
              </intent-filter>'''
          # Insert the RING intent filter right before </activity>
          content = content.replace('</activity>', ring_filter + '\n            </activity>', 1)
          with open('$M', 'w') as f:
              f.write(content)
          "
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/flutter.minSdkVersion/23/' "$f" || true
            [ -f "$f" ] && sed -i 's/flutter.targetSdkVersion/35/' "$f" || true
          done
          # Proguard rules to prevent R8 from stripping device_calendar native models
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class com.builttoroam.devicecalendar.** { *; }
          -keepclassmembers class com.builttoroam.devicecalendar.** { *; }
          -dontwarn com.builttoroam.devicecalendar.**
          EOF
          # Install Pillow for image generation
          python3 -m pip install --break-system-packages Pillow
          # Clean out ALL default Flutter icons from drawable and mipmap folders
          rm -f android/app/src/main/res/drawable/ic_launcher*
          rm -f android/app/src/main/res/drawable-v21/ic_launcher*
          rm -rf android/app/src/main/res/mipmap-*
          # Generate icons across all mipmap densities from assets/icon.jpg
          python3 -c "
          import os
          from PIL import Image, ImageDraw

          src = 'assets/icon.jpg'
          if not os.path.exists(src):
              raise FileNotFoundError(f'Icon source {src} not found!')

          img = Image.open(src).convert('RGBA')

          densities = {
              'mipmap-mdpi': (48, 108),
              'mipmap-hdpi': (72, 162),
              'mipmap-xhdpi': (96, 216),
              'mipmap-xxhdpi': (144, 324),
              'mipmap-xxxhdpi': (192, 432),
          }

          for folder, (size, fg_size) in densities.items():
              target_dir = os.path.join('android/app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)

              # 1. Standard full launcher icon
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')

              # 2. Round launcher icon (circular mask)
              mask = Image.new('L', (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size, size), fill=255)
              round_img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              round_img.paste(resized, (0, 0), mask=mask)
              round_img.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')

              # 3. Adaptive foreground (sized at 70% of canvas, centered in 108dp)
              fg = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              inner_dim = int(fg_size * 0.70)
              inner_icon = img.resize((inner_dim, inner_dim), Image.Resampling.LANCZOS)
              pos = ((fg_size - inner_dim) // 2, (fg_size - inner_dim) // 2)
              fg.paste(inner_icon, pos, inner_icon)
              fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

          # 4. Background color for adaptive icons
          values_dir = 'android/app/src/main/res/values'
          os.makedirs(values_dir, exist_ok=True)
          with open(os.path.join(values_dir, 'ic_launcher_background.xml'), 'w') as f:
              f.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#051719</color>\n</resources>\n')

          # 5. Adaptive XML definition (API 26+)
          v26_dir = 'android/app/src/main/res/mipmap-anydpi-v26'
          os.makedirs(v26_dir, exist_ok=True)
          adaptive_xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <background android:drawable=\"@color/ic_launcher_background\"/>
              <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>
          </adaptive-icon>'''
          with open(os.path.join(v26_dir, 'ic_launcher.xml'), 'w') as f:
              f.write(adaptive_xml)
          with open(os.path.join(v26_dir, 'ic_launcher_round.xml'), 'w') as f:
              f.write(adaptive_xml)

          print('All Awan launcher icons successfully generated!')
          "
          # Verify generated icons
          ls -la android/app/src/main/res/mipmap-xxxhdpi/
          # Inject native lockscreen wake flags, keyguard dismissal, and fullscreen intent helper into MainActivity.kt
          python3 -c "
          import glob
          files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          if files:
              with open(files[0], 'r') as f:
                  pkg = [l for l in f if l.startswith('package ')][0]
              content = f'''{pkg}
          import android.app.KeyguardManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.WindowManager
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {{
              private val CHANNEL = \"com.adhan_alarm.app/fullscreen_settings\"

              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {{
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                      val keyguardManager = getSystemService(Context.KEYGUARD_SERVICE) as? KeyguardManager
                      keyguardManager?.requestDismissKeyguard(this, null)
                  }} else {{
                      @Suppress(\"DEPRECATION\")
                      window.addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                      )
                  }}
              }}

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler {{ call, result ->
                      when (call.method) {{
                          \"canUseFullScreenIntent\" -> {{
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {{
                                  val notificationManager = getSystemService(NotificationManager::class.java)
                                  result.success(notificationManager.canUseFullScreenIntent())
                              }} else {{
                                  result.success(true)
                              }}
                          }}
                          \"openFullScreenIntentSettings\" -> {{
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {{
                                  try {{
                                      val intent = Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT).apply {{
                                          data = Uri.parse(\"package:$packageName\")
                                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      }}
                                      startActivity(intent)
                                      result.success(true)
                                  }} catch (e: Exception) {{
                                      val fallback = Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS).apply {{
                                          putExtra(Settings.EXTRA_APP_PACKAGE, packageName)
                                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      }}
                                      startActivity(fallback)
                                      result.success(true)
                                  }}
                              }} else {{
                                  val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {{
                                      data = Uri.parse(\"package:$packageName\")
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }}
                                  startActivity(intent)
                                  result.success(true)
                              }}
                          }}
                          else -> result.notImplemented()
                      }}
                  }}
              }}
          }}
          '''
              with open(files[0], 'w') as f:
                  f.write(content)
          "
      - name: Force compileSdk 36 and consistent JVM target for all Android plugins
        run: |
          mkdir -p ~/.gradle/init.d
          echo "kotlin.jvm.target.validation.mode=warning" >> ~/.gradle/gradle.properties
          cat > ~/.gradle/init.d/sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdkVersion 36
                try {
                  p.android.compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_11
                    targetCompatibility = JavaVersion.VERSION_11
                  }
                } catch (Throwable ignored) {}
                try {
                  p.android.kotlinOptions {
                    jvmTarget = "11"
                  }
                } catch (Throwable ignored) {}
              }
              p.tasks.matching { it.name.contains("Kotlin") }.configureEach { task ->
                try {
                  task.kotlinOptions.jvmTarget = "11"
                } catch (Throwable ignored) {}
              }
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare Awan.apk output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Awan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Awan-APK
          path: build/app/outputs/flutter-apk/Awan.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create iOS project
        run: flutter create . --platforms=ios --project-name adhan_alarm
      - name: Configure iOS Info.plist permissions and background modes
        run: |
          PLIST=ios/Runner/Info.plist
          python3 -c "
          import plistlib
          with open('$PLIST', 'rb') as f:
              data = plistlib.load(f)
          data['UIBackgroundModes'] = ['audio', 'fetch', 'processing']
          data['CFBundleDisplayName'] = 'Awan'
          data['CFBundleName'] = 'Awan'
          data['CFBundleDevelopmentRegion'] = 'en'
          data['CFBundleLocalizations'] = ['en', 'ar']
          data['NSLocationWhenInUseUsageDescription'] = 'Awan needs your location to calculate accurate offline prayer times.'
          data['NSCalendarsUsageDescription'] = 'Awan needs access to your calendar to add prayer alarm events.'
          data['NSCalendarsFullAccessUsageDescription'] = 'Awan needs full calendar access to create and manage alarm events in your selected calendar.'
          data['NSCalendarsWriteOnlyUsageDescription'] = 'Awan needs calendar write access to add prayer alarm events.'
          data['BGTaskSchedulerPermittedIdentifiers'] = ['dev.fluttercommunity.workmanager.iOSBackgroundProcessingTask', 'dev.fluttercommunity.workmanager.iOSBackgroundFetchTask', 'daily_prayer_reschedule_task']
          with open('$PLIST', 'wb') as f:
              plistlib.dump(data, f)
          print('Info.plist successfully updated for iOS!')
          "
      - name: Generate iOS App Icon from assets/icon.jpg
        run: |
          python3 -m pip install --break-system-packages Pillow
          python3 -c "
          import os, json
          from PIL import Image

          src = 'assets/icon.jpg'
          img = Image.open(src).convert('RGBA')
          iconset_dir = 'ios/Runner/Assets.xcassets/AppIcon.appiconset'
          os.makedirs(iconset_dir, exist_ok=True)

          # Generate 1024x1024 App Store icon
          master = img.resize((1024, 1024), Image.Resampling.LANCZOS)
          master.save(os.path.join(iconset_dir, 'Icon-App-1024x1024@1x.png'), 'PNG')

          contents = {
              'images': [
                  {
                      'size': '1024x1024',
                      'idiom': 'universal',
                      'filename': 'Icon-App-1024x1024@1x.png',
                      'platform': 'ios'
                  }
              ],
              'info': {
                  'version': 1,
                  'author': 'xcode'
              }
          }
          with open(os.path.join(iconset_dir, 'Contents.json'), 'w') as f:
              json.dump(contents, f, indent=2)
          print('iOS App Icon successfully created!')
          "
      - name: Setup Podfile with permission definitions
        run: |
          flutter pub get
          cat > ios/Podfile <<'EOF'
          platform :ios, '13.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= [
                  '$(inherited)',
                  'PERMISSION_EVENTS=1',
                  'PERMISSION_NOTIFICATIONS=1',
                  'PERMISSION_LOCATION=1',
                ]
              end
            end
          end
          EOF
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
      - name: Package Awan.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Awan.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Awan-IPA
          path: Awan.ipa
