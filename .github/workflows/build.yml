name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android and iOS projects
        run: flutter create . --platforms=android,ios --project-name adhan_alarm
      - name: Configure Android permissions and full-screen intent support
        run: |
          M=android/app/src/main/AndroidManifest.xml
          P='<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.DISABLE_KEYGUARD"/>'
          sed -i "s|<application|$P<application|" $M
          sed -i 's|<activity|<activity android:showWhenLocked="true" android:turnScreenOn="true" android:inheritShowWhenLocked="true"|' $M
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/flutter.minSdkVersion/23/' "$f" || true
            [ -f "$f" ] && sed -i 's/flutter.targetSdkVersion/35/' "$f" || true
          done
          # Inject native lockscreen wake flags into MainActivity.kt
          python3 -c "
          import glob
          files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          if files:
              with open(files[0], 'r') as f:
                  pkg = [l for l in f if l.startswith('package ')][0]
              content = f'''{pkg}
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {{
              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {{
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  }}
              }}
          }}
          '''
              with open(files[0], 'w') as f:
                  f.write(content)
          "
      - name: Configure iOS background modes and permissions for iOS 17 and 18
        run: |
          PLIST=ios/Runner/Info.plist
          if [ -f "$PLIST" ]; then
            python3 -c "
          import plistlib
          with open('$PLIST', 'rb') as f:
              data = plistlib.load(f)
          data['UIBackgroundModes'] = ['audio', 'fetch', 'processing']
          data['NSLocationWhenInUseUsageDescription'] = 'Adhan Alarm needs your location to calculate accurate offline prayer times.'
          data['BGTaskSchedulerPermittedIdentifiers'] = ['dev.fluttercommunity.workmanager.iOSBackgroundProcessingTask', 'dev.fluttercommunity.workmanager.iOSBackgroundFetchTask', 'daily_prayer_reschedule_task']
          with open('$PLIST', 'wb') as f:
              plistlib.dump(data, f)
          "
          fi
      - name: Force compileSdk 36 for all Android plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk.gradle <<'EOF'
          allprojects { afterEvaluate { p -> if (p.hasProperty('android')) { p.android.compileSdkVersion 36 } } }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: adhan-alarm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
